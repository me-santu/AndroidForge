
name: DocuScan Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Extract DocuScan ZIP
        shell: bash
        run: |
          set -e

          ZIP="input/docuscan.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP not found: $ZIP"
            echo "Available ZIP files:"
            ls -la input/
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          mkdir -p "$RUNNER_TEMP/docuscan"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/docuscan"

          GRADLEW=$(find "$RUNNER_TEMP/docuscan" -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found in ZIP"
            find "$RUNNER_TEMP/docuscan" -maxdepth 3 -type f | head -n 50
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project root: $PROJECT_DIR"

      - name: Generate Debug Keystore
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$PROJECT_DIR/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/apk"

          find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} "$RUNNER_TEMP/apk/" \;

          if [ -z "$(ls -A "$RUNNER_TEMP/apk")" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          ls -lh "$RUNNER_TEMP/apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocuScan-APK
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 7
