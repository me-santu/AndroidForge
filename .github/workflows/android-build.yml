
name: DocuScan Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Extract DocuScan ZIP
        run: |
          ZIP=$(ls -t input/*.zip | head -n 1)
          echo "Using ZIP: $ZIP"

          mkdir -p "$RUNNER_TEMP/docuscan"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/docuscan"

          GRADLEW=$(find "$RUNNER_TEMP/docuscan" -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          find "$PROJECT_DIR" -path '*/build/outputs/apk/debug/*.apk' -exec cp {} "$RUNNER_TEMP/apk/" \;
          test -n "$(ls -A "$RUNNER_TEMP/apk")"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocuScan-APK
          path: ${{ runner.temp }}/apk/*.apk
          
